<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Analysis - Event Registration Improvement</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f4f8;
            overflow-x: hidden; /* Prevent horizontal scroll on body */
        }
        
        /* Glassmorphism Classes */
        .glass-sidebar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.5);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        .animate-slide-in {
            animation: slideIn 0.4s ease-out;
        }
        
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .progress-bar {
            height: 4px;
            background: linear-gradient(90deg, #60a5fa 0%, #a855f7 100%);
            transition: width 0.5s ease-in-out;
        }

        /* Print Optimization */
        @media print {
            @page { margin: 1cm; size: auto; }
            body { 
                background: white !important; 
                -webkit-print-color-adjust: exact; 
                overflow: visible !important;
            }
            .print-hidden { display: none !important; }
            .print-full-width { 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                max-width: none !important; 
                overflow: visible !important;
            }
            .sidebar-container { display: none !important; }
            .main-content { margin-left: 0 !important; width: 100% !important; }
            .page-break { page-break-before: always; }
            .shadow-xl, .shadow-lg, .shadow-2xl { box-shadow: none !important; border: 1px solid #ddd !important; }
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const IconWrapper = ({ icon, color, size = "w-6 h-6" }) => (
            <span className={`inline-flex items-center justify-center ${size} mr-2 ${color || 'text-gray-600'}`}>
                {icon}
            </span>
        );

        // Define icons as components for reuse
        const FileText = () => <IconWrapper icon="📄" />;
        const Download = () => <IconWrapper icon="⬇️" color="text-white" />;
        const AlertCircle = () => <IconWrapper icon="⚠️" />;
        const Users = () => <IconWrapper icon="👥" />;
        const Target = () => <IconWrapper icon="🎯" />;
        const Lightbulb = () => <IconWrapper icon="💡" />;
        const TrendingUp = () => <IconWrapper icon="📈" />;
        const CheckCircle = () => <IconWrapper icon="✅" />;
        const Share = () => <IconWrapper icon="🔗" />;
        const MenuIcon = () => <IconWrapper icon="☰" />;

        // --- Components ---

        const QuickStatCard = ({ value, label, color, icon }) => (
            <div className={`p-4 rounded-xl hover-lift ${color} shadow-lg text-center transform transition-all duration-300`}>
                <div className="text-3xl mb-2">{icon}</div>
                <div className="text-3xl font-bold mb-1">{value}</div>
                <div className="text-sm font-medium opacity-90">{label}</div>
            </div>
        );

        const SidebarItem = ({ id, label, icon: Icon, activeTab, onClick, color }) => {
            const isActive = activeTab === id;
            return (
                <button 
                    onClick={() => onClick(id)}
                    className={`w-full flex items-center px-4 py-3 rounded-xl mb-2 transition-all duration-300 group
                    ${isActive 
                        ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md transform scale-105' 
                        : 'hover:bg-white/60 text-gray-600 hover:text-blue-700'
                    }`}
                >
                    <div className={`transition-transform duration-300 ${isActive ? 'scale-110' : 'group-hover:scale-110'}`}>
                        <Icon />
                    </div>
                    <span className={`font-medium ${isActive ? 'font-bold' : ''}`}>{label}</span>
                    {isActive && <div className="ml-auto w-1.5 h-1.5 rounded-full bg-white animate-pulse"></div>}
                </button>
            );
        };

        const BAProject = () => {
          const [activeTab, setActiveTab] = useState('overview');
          const [isSidebarOpen, setIsSidebarOpen] = useState(false); // Mobile sidebar state
          const [progress, setProgress] = useState(0);

          const myName = "Panyarat Netruen"; 
          const myPosition = "Head of Computer Science (CS27)";

          const tabs = [
            { id: 'overview', label: 'Executive Summary', icon: FileText, color: 'text-blue-600' },
            { id: 'problem', label: 'Problem Analysis', icon: AlertCircle, color: 'text-red-600' },
            { id: 'current', label: 'As-Is Process', icon: Users, color: 'text-orange-600' },
            { id: 'analysis', label: 'Root Cause', icon: Target, color: 'text-purple-600' },
            { id: 'solution', label: 'Proposed Solution', icon: Lightbulb, color: 'text-yellow-600' },
            { id: 'impact', label: 'Business Impact', icon: TrendingUp, color: 'text-green-600' },
            { id: 'roadmap', label: 'Implementation', icon: CheckCircle, color: 'text-teal-600' }
          ];

          // Update Progress Bar based on active tab
          useEffect(() => {
            const currentIndex = tabs.findIndex(t => t.id === activeTab);
            const newProgress = ((currentIndex + 1) / tabs.length) * 100;
            setProgress(newProgress);
            
            // Auto close sidebar on mobile when navigating
            if (window.innerWidth < 768) {
                setIsSidebarOpen(false);
            }
          }, [activeTab]);

          const exportToPDF = () => {
            window.print();
          };

          const sharePortfolio = () => {
            if (navigator.share) {
              navigator.share({
                title: 'Business Analysis - Panyarat Netruen',
                text: 'Business Analysis Portfolio - Event Registration Improvement',
                url: window.location.href,
              });
            } else {
              alert('Link copied to clipboard: ' + window.location.href);
            }
          };

          const renderContent = () => {
            switch(activeTab) {
              case 'overview':
                return (
                  <div className="space-y-6 animate-fade-in">
                    <div className="bg-gradient-to-r from-blue-600 via-purple-600 to-indigo-700 text-white p-8 rounded-2xl shadow-2xl relative overflow-hidden">
                      <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -mr-32 -mt-32" />
                      <div className="absolute bottom-0 left-0 w-48 h-48 bg-white opacity-5 rounded-full -ml-24 -mb-24" />
                      
                      <div className="relative flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                          <div className="flex-1">
                            <div className="inline-block bg-white/20 backdrop-blur-sm px-4 py-1 rounded-full text-sm font-semibold mb-3 border border-white/20">
                               Business Analysis Project
                            </div>
                            <h2 className="text-4xl font-bold mb-3 leading-tight">Event Registration Process Improvement</h2>
                            <p className="text-xl opacity-90 mb-2">CS Department, Kasetsart University Sriracha</p>
                            <p className="opacity-80">December 2025</p>
                          </div>
                          <div className="bg-white/10 p-6 rounded-xl backdrop-blur-sm border border-white/20 hover-lift">
                            <p className="text-xs font-semibold opacity-70 uppercase tracking-wider mb-2">Prepared By</p>
                            <p className="text-xl font-bold">{myName}</p>
                            <p className="text-sm opacity-90 mt-1">{myPosition}</p>
                          </div>
                      </div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-6">
                      <div className="bg-gradient-to-br from-red-50 to-red-100 border-l-4 border-red-500 p-6 rounded-xl shadow-lg hover-lift">
                        <h3 className="font-bold text-xl mb-3 text-red-800 flex items-center gap-2">
                          <AlertCircle/> Problem Statement
                        </h3>
                        <p className="text-gray-700 leading-relaxed">
                          Current manual event registration process takes <strong className="text-red-600">5 days</strong> to complete, 
                          causing low student participation (<strong className="text-red-600">45% satisfaction</strong>) and administrative burden 
                          for staff managing <strong>300+ students</strong> across <strong>20+ annual events</strong>.
                        </p>
                      </div>

                      <div className="bg-gradient-to-br from-green-50 to-green-100 border-l-4 border-green-500 p-6 rounded-xl shadow-lg hover-lift">
                        <h3 className="font-bold text-xl mb-3 text-green-800 flex items-center gap-2">
                          <CheckCircle/> Solution Overview
                        </h3>
                        <p className="text-gray-700 leading-relaxed">
                          Implement automated online registration system with real-time approval, 
                          reducing process time by <strong className="text-green-600">60%</strong> and improving student 
                          satisfaction to <strong className="text-green-600">85%</strong>.
                        </p>
                      </div>
                    </div>

                    <div className="glass-panel bg-white rounded-2xl p-8 shadow-xl border border-gray-100">
                      <h3 className="font-bold text-2xl mb-6 text-gray-800 gradient-text">Expected Business Impact</h3>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <QuickStatCard 
                          value="60%" 
                          label="Time Reduction" 
                          color="bg-gradient-to-br from-blue-500 to-blue-600 text-white"
                          icon="⚡"
                        />
                        <QuickStatCard 
                          value="50K" 
                          label="Annual Savings (฿)" 
                          color="bg-gradient-to-br from-green-500 to-green-600 text-white"
                          icon="💰"
                        />
                        <QuickStatCard 
                          value="67%" 
                          label="Manual Work Reduced" 
                          color="bg-gradient-to-br from-purple-500 to-purple-600 text-white"
                          icon="🤖"
                        />
                        <QuickStatCard 
                          value="85%" 
                          label="Satisfaction Target" 
                          color="bg-gradient-to-br from-orange-500 to-orange-600 text-white"
                          icon="😊"
                        />
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-yellow-50 to-yellow-100 border border-yellow-200 p-6 rounded-xl shadow-lg">
                      <h3 className="font-bold mb-4 text-yellow-800 text-xl">📋 Project Methodology</h3>
                      <div className="grid md:grid-cols-2 gap-4">
                        <div className="bg-white p-4 rounded-lg shadow-sm hover-lift">
                          <span className="text-green-600 text-xl">✓</span>
                          <strong className="ml-2">Stakeholder Interviews:</strong>
                          <p className="text-sm text-gray-600 ml-7 mt-1">8 students, 3 staff, 2 faculty members</p>
                        </div>
                        <div className="bg-white p-4 rounded-lg shadow-sm hover-lift">
                          <span className="text-green-600 text-xl">✓</span>
                          <strong className="ml-2">Process Mapping:</strong>
                          <p className="text-sm text-gray-600 ml-7 mt-1">BPMN 2.0 (As-Is and To-Be)</p>
                        </div>
                        <div className="bg-white p-4 rounded-lg shadow-sm hover-lift">
                          <span className="text-green-600 text-xl">✓</span>
                          <strong className="ml-2">Root Cause Analysis:</strong>
                          <p className="text-sm text-gray-600 ml-7 mt-1">5 Whys and Fishbone Diagram</p>
                        </div>
                        <div className="bg-white p-4 rounded-lg shadow-sm hover-lift">
                          <span className="text-green-600 text-xl">✓</span>
                          <strong className="ml-2">Financial Analysis:</strong>
                          <p className="text-sm text-gray-600 ml-7 mt-1">3-year NPV, ROI, Payback Period</p>
                        </div>
                      </div>
                    </div>
                  </div>
                );

              case 'problem':
                return (
                  <div className="space-y-6 animate-fade-in">
                    <h2 className="text-3xl font-bold text-gray-800 gradient-text mb-2">Problem Analysis and Stakeholder Impact</h2>
                    <p className="text-gray-600 mb-6">Understanding pain points across all stakeholder groups</p>
                    
                    <div className="glass-panel bg-white border rounded-2xl p-8 shadow-xl">
                      <h3 className="font-bold text-xl mb-6 flex items-center gap-2">
                        <span className="text-2xl">📊</span> Current Situation Analysis
                      </h3>
                      <div className="space-y-6">
                        <div className="border-l-4 border-red-500 pl-6 bg-gradient-to-r from-red-50 to-transparent p-4 rounded-r-xl hover-lift">
                          <h4 className="font-semibold text-red-700 text-lg mb-3 flex items-center gap-2">
                            👨‍🎓 For Students <span className="text-xs bg-red-100 px-2 py-1 rounded-full">300+ affected</span>
                          </h4>
                          <ul className="mt-3 space-y-2 text-gray-700 text-sm">
                            <li className="flex items-start gap-2">
                              <span className="text-red-500 mt-1">•</span>
                              <span>Must fill paper forms in person during limited office hours</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-red-500 mt-1">•</span>
                              <span>No visibility into registration status</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-red-500 mt-1">•</span>
                              <span><strong>5-day waiting time</strong> for approval confirmation</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-red-500 mt-1">•</span>
                              <span>Frequent errors due to illegible handwriting (<strong>25% error rate</strong>)</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-red-500 mt-1">•</span>
                              <span>Missed opportunities when events fill up during waiting period</span>
                            </li>
                          </ul>
                        </div>

                        <div className="border-l-4 border-orange-500 pl-6 bg-gradient-to-r from-orange-50 to-transparent p-4 rounded-r-xl hover-lift">
                          <h4 className="font-semibold text-orange-700 text-lg mb-3 flex items-center gap-2">
                            👔 For Staff <span className="text-xs bg-orange-100 px-2 py-1 rounded-full">3 admin staff</span>
                          </h4>
                          <ul className="mt-3 space-y-2 text-gray-700 text-sm">
                            <li className="flex items-start gap-2">
                              <span className="text-orange-500 mt-1">•</span>
                              <span>Manual data entry from <strong>300+ paper forms</strong> per semester</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-orange-500 mt-1">•</span>
                              <span>Repeated phone calls to clarify unclear handwriting</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-orange-500 mt-1">•</span>
                              <span>Excel-based tracking prone to errors</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-orange-500 mt-1">•</span>
                              <span>Unable to generate real-time reports for faculty</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-orange-500 mt-1">•</span>
                              <span><strong>15+ hours per week</strong> spent on registration processing</span>
                            </li>
                          </ul>
                        </div>

                        <div className="border-l-4 border-blue-500 pl-6 bg-gradient-to-r from-blue-50 to-transparent p-4 rounded-r-xl hover-lift">
                          <h4 className="font-semibold text-blue-700 text-lg mb-3 flex items-center gap-2">
                            🎓 For Department <span className="text-xs bg-blue-100 px-2 py-1 rounded-full">Leadership</span>
                          </h4>
                          <ul className="mt-3 space-y-2 text-gray-700 text-sm">
                            <li className="flex items-start gap-2">
                              <span className="text-blue-500 mt-1">•</span>
                              <span>No real-time visibility into event registration numbers</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-blue-500 mt-1">•</span>
                              <span>Difficulty in resource planning (rooms, food, materials)</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-blue-500 mt-1">•</span>
                              <span>Unable to track KPIs (engagement rate, popular events)</span>
                            </li>
                            <li className="flex items-start gap-2">
                              <span className="text-blue-500 mt-1">•</span>
                              <span>Last-minute changes due to inaccurate headcounts</span>
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>

                    <div className="glass-panel bg-white border rounded-2xl p-8 shadow-xl">
                      <h3 className="font-bold text-xl mb-6 flex items-center gap-2">
                        <span className="text-2xl">📈</span> Quantified Pain Points
                      </h3>
                      <div className="overflow-x-auto">
                        <table className="w-full text-sm border-collapse">
                          <thead className="bg-gradient-to-r from-gray-100 to-gray-200">
                            <tr>
                              <th className="p-4 border text-left text-gray-700 font-bold">Metric</th>
                              <th className="p-4 border text-center text-gray-700 font-bold">Current State</th>
                              <th className="p-4 border text-left text-gray-700 font-bold">Impact</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr className="hover:bg-gray-50 transition">
                              <td className="p-4 border font-semibold">⏱️ Processing Time</td>
                              <td className="p-4 border text-center">
                                <span className="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold">5 days</span>
                              </td>
                              <td className="p-4 border text-red-600">Lost opportunities, student frustration</td>
                            </tr>
                            <tr className="bg-gray-50 hover:bg-gray-100 transition">
                              <td className="p-4 border font-semibold">👆 Manual Steps</td>
                              <td className="p-4 border text-center">
                                <span className="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold">12 touchpoints</span>
                              </td>
                              <td className="p-4 border text-red-600">High error rate (25%)</td>
                            </tr>
                            <tr className="hover:bg-gray-50 transition">
                              <td className="p-4 border font-semibold">⏰ Staff Hours</td>
                              <td className="p-4 border text-center">
                                <span className="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold">15 hrs/week</span>
                              </td>
                              <td className="p-4 border text-red-600">60,000 baht per year labor cost</td>
                            </tr>
                            <tr className="bg-gray-50 hover:bg-gray-100 transition">
                              <td className="p-4 border font-semibold">😊 Student Satisfaction</td>
                              <td className="p-4 border text-center">
                                <span className="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold">45%</span>
                              </td>
                              <td className="p-4 border text-red-600">Low engagement, complaints</td>
                            </tr>
                            <tr className="hover:bg-gray-50 transition">
                              <td className="p-4 border font-semibold">✅ Data Accuracy</td>
                              <td className="p-4 border text-center">
                                <span className="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold">75%</span>
                              </td>
                              <td className="p-4 border text-red-600">Wrong planning decisions</td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-blue-50 to-blue-100 border border-blue-200 p-8 rounded-2xl shadow-lg">
                      <h3 className="font-bold mb-6 text-blue-800 text-xl flex items-center gap-2">
                        <span className="text-2xl">💬</span> Stakeholder Quotes (from interviews)
                      </h3>
                      <div className="space-y-6">
                        <blockquote className="italic border-l-4 border-blue-500 pl-6 text-gray-700 bg-white p-5 rounded-r-xl shadow-md hover-lift">
                          "ต้องไปส่งเอกสารตอนเช้า แล้วก็ไม่รู้ว่าลงทะเบียนได้หรือเปล่า ต้องรอเกือบสัปดาห์"
                          <footer className="text-sm mt-3 text-gray-600 font-bold not-italic flex items-center gap-2">
                            <span className="text-xl">👨‍🎓</span> นักศึกษาปี 2
                          </footer>
                        </blockquote>
                        <blockquote className="italic border-l-4 border-orange-500 pl-6 text-gray-700 bg-white p-5 rounded-r-xl shadow-md hover-lift">
                          "เราต้องโทรหานักศึกษาบ่อยมาก เพราะอ่านลายมือไม่ออก หรือกรอกข้อมูลไม่ครบ"
                          <footer className="text-sm mt-3 text-gray-600 font-bold not-italic flex items-center gap-2">
                            <span className="text-xl">👔</span> เจ้าหน้าที่ธุรการ
                          </footer>
                        </blockquote>
                      </div>
                    </div>
                  </div>
                );

              case 'current':
                return (
                  <div className="space-y-6 animate-fade-in">
                    <h2 className="text-3xl font-bold text-gray-800 gradient-text mb-2">As-Is Process Flow (Current State)</h2>
                    <p className="text-gray-600 mb-6">Detailed analysis of the existing registration workflow</p>
                    
                    <div className="glass-panel bg-white border rounded-2xl p-8 shadow-xl">
                      <h3 className="font-bold text-xl mb-6 flex items-center gap-2">
                        <span className="text-2xl">🔄</span> Process Overview
                      </h3>
                      <div className="grid md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-gradient-to-br from-red-500 to-red-600 text-white p-4 rounded-xl text-center shadow-lg">
                          <div className="text-3xl font-bold">5</div>
                          <div className="text-sm mt-1">Days Duration</div>
                        </div>
                        <div className="bg-gradient-to-br from-orange-500 to-orange-600 text-white p-4 rounded-xl text-center shadow-lg">
                          <div className="text-3xl font-bold">12</div>
                          <div className="text-sm mt-1">Manual Steps</div>
                        </div>
                        <div className="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-4 rounded-xl text-center shadow-lg">
                          <div className="text-3xl font-bold">6</div>
                          <div className="text-sm mt-1">Handoffs</div>
                        </div>
                        <div className="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-4 rounded-xl text-center shadow-lg">
                          <div className="text-3xl font-bold">3</div>
                          <div className="text-sm mt-1">Systems Used</div>
                        </div>
                      </div>

                                <span>Keep paper backup (1 mo)</span>
                              </li>
                              <li className="flex gap-2 items-start bg-white p-2 rounded shadow-sm">
                                <span className="text-purple-500">✓</span>
                                <span>24/7 help desk</span>
                              </li>
                              <li className="flex gap-2 items-start bg-white p-2 rounded shadow-sm">
                                <span className="text-purple-500">✓</span>
                                <span>Daily system monitoring</span>
                              </li>
                              <li className="flex gap-2 items-start bg-white p-2 rounded shadow-sm">
                                <span className="text-purple-500">✓</span>
                                <span>Rollback plan ready</span>
                              </li>
                            </ul>
                          </div>
                        </div>
                         <div className="mt-6 p-4 bg-gradient-to-r from-purple-100 to-purple-200 text-purple-900 rounded-xl text-sm border-2 border-purple-300 shadow-md">
                            <strong className="flex items-center gap-2 mb-2">
                              <span className="text-lg">📦</span> Deliverables:
                            </strong>
                            <span>Trained users, Full adoption, Support documentation, Performance dashboard</span>
                          </div>
                      </div>
                    </div>

                    <div className="glass-panel bg-white border rounded-2xl p-8 shadow-xl mt-8">
                      <h3 className="font-bold text-xl mb-6 text-gray-800 flex items-center gap-2">
                        <span className="text-2xl">👥</span> Team Roles & Responsibilities
                      </h3>
                      <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div className="border-2 p-4 rounded-xl bg-gradient-to-br from-blue-50 to-white hover-lift shadow-md">
                          <div className="text-2xl mb-2">💼</div>
                          <h4 className="font-semibold text-blue-700 text-sm mb-1">Business Analyst</h4>
                          <p className="text-xs text-gray-600">Requirements, UAT</p>
                        </div>
                        <div className="border-2 p-4 rounded-xl bg-gradient-to-br from-green-50 to-white hover-lift shadow-md">
                          <div className="text-2xl mb-2">👨‍💻</div>
                          <h4 className="font-semibold text-green-700 text-sm mb-1">Developers (2-3)</h4>
                          <p className="text-xs text-gray-600">Frontend, Backend</p>
                        </div>
                        <div className="border-2 p-4 rounded-xl bg-gradient-to-br from-purple-50 to-white hover-lift shadow-md">
                          <div className="text-2xl mb-2">🔍</div>
                          <h4 className="font-semibold text-purple-700 text-sm mb-1">QA Engineer</h4>
                          <p className="text-xs text-gray-600">Testing, Quality</p>
                        </div>
                        <div className="border-2 p-4 rounded-xl bg-gradient-to-br from-orange-50 to-white hover-lift shadow-md">
                          <div className="text-2xl mb-2">📊</div>
                          <h4 className="font-semibold text-orange-700 text-sm mb-1">Project Manager</h4>
                          <p className="text-xs text-gray-600">Timeline, Budget</p>
                        </div>
                        <div className="border-2 p-4 rounded-xl bg-gradient-to-br from-red-50 to-white hover-lift shadow-md">
                          <div className="text-2xl mb-2">🔄</div>
                          <h4 className="font-semibold text-red-700 text-sm mb-1">Change Manager</h4>
                          <p className="text-xs text-gray-600">Training, Adoption</p>
                        </div>
                        <div className="border-2 p-4 rounded-xl bg-gradient-to-br from-teal-50 to-white hover-lift shadow-md">
                          <div className="text-2xl mb-2">🖥️</div>
                          <h4 className="font-semibold text-teal-700 text-sm mb-1">IT Support</h4>
                          <p className="text-xs text-gray-600">Infrastructure</p>
                        </div>
                      </div>
                    </div>

                    <div className="bg-gradient-to-r from-green-500 via-emerald-500 to-teal-600 text-white p-8 rounded-2xl shadow-2xl mt-8 relative overflow-hidden">
                      <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-10 rounded-full -mr-32 -mt-32" />
                      <div className="relative">
                        <h3 className="text-2xl font-bold mb-5 flex items-center gap-2">
                          <span className="text-3xl">✨</span> Final Recommendations
                        </h3>
                        <div className="space-y-4 text-sm ml-4">
                          <div className="flex items-start gap-3 bg-white/10 backdrop-blur-sm p-4 rounded-xl border border-white/20">
                            <span className="text-2xl flex-shrink-0">✓</span>
                            <p><strong className="text-lg">Approve Phase 1 immediately</strong> - foundation work can start now</p>
                          </div>
                          <div className="flex items-start gap-3 bg-white/10 backdrop-blur-sm p-4 rounded-xl border border-white/20">
                            <span className="text-2xl flex-shrink-0">✓</span>
                            <p><strong className="text-lg">Allocate 183,000฿ budget</strong> for Year 1 (ROI positive by Year 3)</p>
                          </div>
                          <div className="flex items-start gap-3 bg-white/10 backdrop-blur-sm p-4 rounded-xl border border-white/20">
                            <span className="text-2xl flex-shrink-0">✓</span>
                            <p><strong className="text-lg">Assign dedicated BA</strong> to lead requirements and stakeholder management</p>
                          </div>
                          <div className="flex items-start gap-3 bg-white/10 backdrop-blur-sm p-4 rounded-xl border border-white/20">
                            <span className="text-2xl flex-shrink-0">✓</span>
                            <p><strong className="text-lg">Full rollout by Month 6</strong> - ready for next semester</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                );

              default:
                return null;
            }
          };

          return (
            <div className="flex w-full h-full relative">
                {/* Mobile Sidebar Overlay */}
                {isSidebarOpen && (
                    <div 
                        className="fixed inset-0 bg-black/50 z-30 md:hidden backdrop-blur-sm"
                        onClick={() => setIsSidebarOpen(false)}
                    ></div>
                )}

                {/* Sidebar */}
                <div className={`sidebar-container glass-sidebar w-72 h-full flex flex-col fixed md:relative z-40 transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                    
                    <div className="p-6 border-b border-white/50">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md text-xl">
                                🚀
                            </div>
                            <div className="text-left">
                                <h2 className="font-bold text-gray-800 text-lg leading-none">Project</h2>
                                <p className="text-xs text-blue-600 font-medium mt-1">Event Registration</p>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 custom-scrollbar">
                        {tabs.map((tab) => (
                            <SidebarItem 
                                key={tab.id}
                                {...tab}
                                activeTab={activeTab}
                                onClick={setActiveTab}
                            />
                        ))}
                    </div>

                    <div className="p-4 border-t border-white/50 text-center text-xs text-gray-500">
                        © 2025 Portfolio
                    </div>
                </div>

                {/* Main Content */}
                <div className="main-content flex-1 h-full flex flex-col overflow-hidden relative w-full">
                    {/* Top Bar */}
                    <header className="glass-panel sticky top-0 z-20 px-6 py-3 flex justify-between items-center shadow-sm print-hidden">
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                                className="md:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg transition"
                            >
                                <MenuIcon />
                            </button>
                            <h1 className="font-bold text-lg text-gray-700 hidden sm:block">Business Analysis</h1>
                        </div>

                        <div className="flex gap-2">
                             <button onClick={sharePortfolio} className="flex items-center gap-2 px-3 py-2 text-sm font-medium text-purple-700 bg-purple-50 hover:bg-purple-100 rounded-lg transition shadow-sm hover-lift">
                                <Share /> <span className="hidden sm:inline">Share</span>
                             </button>
                             <button onClick={exportToPDF} className="flex items-center gap-2 px-3 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-md hover-lift">
                                <Download /> <span className="hidden sm:inline">Export PDF</span>
                             </button>
                        </div>
                        
                        {/* Progress Bar */}
                        <div className="absolute bottom-0 left-0 w-full bg-gray-200 h-1">
                            <div className="progress-bar" style={{ width: `${progress}%` }}></div>
                        </div>
                    </header>

                    {/* Scrollable Content Area */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth print-full-width">
                        <div className="max-w-5xl mx-auto pb-12">
                             {renderContent()}
                        </div>
                    </main>
                </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BAProject />);
    </script>
</body>

</html>
